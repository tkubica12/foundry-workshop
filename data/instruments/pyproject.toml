[project]
name = "aster-vale-corpus-authoring"
version = "0.1.0"
description = "Offline authoring and verification tools for a synthetic instrument PDF corpus"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Pillow==10.4.0",
  "PyMuPDF==1.28.0",
  "playwright==1.52.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "approved"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true
