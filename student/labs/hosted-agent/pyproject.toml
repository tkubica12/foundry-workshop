[project]
name = "workshop-hosted-agent"
version = "0.1.0"
description = "An isolated LangGraph agent hosted in Microsoft Foundry"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langchain-azure-ai[hosting,opentelemetry]==1.2.10",
  "langchain==1.4.2",
  "langgraph==1.2.12",
  "langchain-openai==1.6.5",
  "langchain-mcp-adapters==0.3.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "azure-ai-projects==2.7.0",
  "azure-identity==1.25.3",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[[tool.uv.index]]
name = "approved"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
