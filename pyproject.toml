[project]
name = "foundry-workshop"
version = "0.1.0"
description = "Attendee labs for a customer-neutral, one-day Microsoft Foundry workshop"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "playwright>=1.58.0,<2",
  "pytest>=9.0.2,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
